[project]
name = "heatpump-optimizer"
version = "0.2.0"
description = "Home Assistant integration for physics-based heat pump optimization"
license = "MIT"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator
    "SIM102", # nested ifs kept where each condition carries its own comment
    "SIM105", # explicit try/except/pass kept over contextlib.suppress
    "UP042",  # (str, Enum) kept: StrEnum changes str() of persisted values
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.heatpump_optimizer"]
